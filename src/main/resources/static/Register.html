<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol | Ülke Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-xl border-t-4 border-purple-600 w-full max-w-md">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">📝 Kayıt Ol</h2>

    <form id="registerForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Kullanıcı Adı</label>
        <input type="text" id="regUsername" required minlength="3" maxlength="50"
               class="w-full border border-gray-300 p-2.5 rounded-md focus:ring-purple-500 focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">E-posta</label>
        <input type="email" id="regEmail" required
               class="w-full border border-gray-300 p-2.5 rounded-md focus:ring-purple-500 focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Şifre</label>
        <input type="password" id="regPassword" required minlength="6"
               class="w-full border border-gray-300 p-2.5 rounded-md focus:ring-purple-500 focus:border-purple-500">
        <p class="text-xs text-gray-500 mt-1">En az 6 karakter olmalı</p>
      </div>

      <div id="registerError" class="text-red-600 text-sm hidden"></div>
      <div id="registerSuccess" class="text-green-600 text-sm hidden"></div>

      <button type="submit"
              class="w-full bg-purple-600 text-white px-8 py-3 rounded-md hover:bg-purple-700 transition font-bold shadow-lg">
        Kayıt Ol
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Zaten hesabın var mı?
      <a href="/login.html" class="text-purple-600 font-semibold hover:underline">Giriş yap</a>
    </p>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const errorBox = document.getElementById('registerError');
    const successBox = document.getElementById('registerSuccess');
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');

    // ÖNEMLİ: Bu key isimleri, backend'deki RegisterRequest DTO'ndaki alan adlarıyla
    // BİREBİR (case-sensitive) eşleşmeli. Senin DTO'nda alan "mail" ise burada da "mail" olmalı,
    // eğer "email" olarak değiştirdiysen burayı da "email" yap.
    const payload = {
      username: document.getElementById('regUsername').value,
      mail: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value
    };

    try {
      const res = await fetch(`${AUTH_API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const text = await res.text();

      if (!res.ok) {
        throw new Error(text || "Kayıt sırasında bir hata oluştu");
      }

      successBox.textContent = "Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...";
      successBox.classList.remove('hidden');

      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1200);
    } catch (error) {
      errorBox.textContent = error.message || "Kayıt başarısız oldu.";
      errorBox.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
