<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülke Yönetim Paneli | Eren Altun</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
    <header class="main-header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h1>Ülke Bilgi Sistemi</h1>
                <p>Spring Boot & JPA Backend Projesi</p>
            </div>
            <!-- Giriş yapmışsa kullanıcı adı + çıkış butonu, yapmamışsa giriş/kayıt linkleri burada gösterilir -->
            <div id="authStatus"></div>
        </div>
    </header>

    <div class="search-card">
        <div class="input-field">
            <label for="countryCode">Ülke Ara (Kod)</label>
            <input type="text" id="countryCode" placeholder="Örn: TR">
        </div>
        <div class="action-buttons">
            <button onclick="getCountry()" class="btn btn-primary">Sorgula</button>
            <button onclick="loadAllCountries()" class="btn btn-success">Tümünü Listele</button>
            <button onclick="window.location.href='/add-country.html'" class="btn btn-info">+ Yeni Ülke</button>
        </div>
    </div>

    <div class="currency-panel">
        <h3>🏆 En Değerli 5 Para Birimi (Canlı TRY Karşılığı)</h3>
        <div id="top5Currencies" class="currency-grid">
        </div>
    </div>

    <div class="table-wrapper">
        <table class="data-table">
            <thead>
            <tr>
                <th>Ülke Adı</th>
                <th>ISO Kodu</th>
                <th onclick="togglePhoneSort()" class="sortable">Telefon Kodu <span id="sortIcon"></span></th>
                <th class="text-right">İşlemler</th>
            </tr>
            </thead>
            <tbody id="countryTableBody">
            <!-- Veriler app.js tarafından doldurulacak -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="countryModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 id="modalCountryName">Detaylar</h3>
        <div id="modalContent" class="modal-body"></div>
        <button onclick="closeModal()" class="btn btn-primary btn-block">Kapat</button>
    </div>
</div>

<!-- auth.js, app.js'ten ÖNCE yüklenmeli çünkü app.js onun fonksiyonlarını kullanıyor -->
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
