<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Ülke Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-xl border-t-4 border-purple-600 w-full max-w-md">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">🔐 Giriş Yap</h2>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Kullanıcı Adı</label>
        <input type="text" id="loginUsername" required
               class="w-full border border-gray-300 p-2.5 rounded-md focus:ring-purple-500 focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Şifre</label>
        <input type="password" id="loginPassword" required
               class="w-full border border-gray-300 p-2.5 rounded-md focus:ring-purple-500 focus:border-purple-500">
      </div>

      <div id="loginError" class="text-red-600 text-sm hidden"></div>

      <button type="submit"
              class="w-full bg-purple-600 text-white px-8 py-3 rounded-md hover:bg-purple-700 transition font-bold shadow-lg">
        Giriş Yap
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Hesabın yok mu?
      <a href="/register.html" class="text-purple-600 font-semibold hover:underline">Kayıt ol</a>
    </p>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const errorBox = document.getElementById('loginError');
    errorBox.classList.add('hidden');

    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const res = await fetch(`${AUTH_API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => null);
        throw new Error(err?.message || "Kullanıcı adı veya şifre yanlış");
      }

      const data = await res.json();
      // Backend'in LoginResponse alanları: accessToken, refreshToken, username, message
      saveToken(data.accessToken, data.username);
      if (data.refreshToken) {
        localStorage.setItem('jwt_refresh_token', data.refreshToken);
      }

      window.location.href = '/index.html';
    } catch (error) {
      errorBox.textContent = error.message || "Giriş başarısız, bilgilerinizi kontrol edin.";
      errorBox.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
