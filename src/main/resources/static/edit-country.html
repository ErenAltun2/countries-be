<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülke Düzenle | Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="container mx-auto p-6 max-w-xl mt-10">
    <div class="bg-white p-8 rounded-lg shadow-xl border-t-4 border-blue-600">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-3xl font-bold text-gray-800">✏️ Ülke Düzenle</h2>
            <button onclick="window.location.href='/index.html'" class="text-gray-500 hover:text-gray-800 transition font-medium">← İptal</button>
        </div>

        <div id="loadingIndicator" class="text-center py-4 text-blue-600 font-semibold hidden">
            Veriler yükleniyor...
        </div>

        <form id="editCountryForm" class="space-y-5 hidden">
            <div>
                <label class="block text-sm font-semibold text-gray-500 mb-1">Ülke Kodu (Değiştirilemez)</label>
                <input type="text" id="editCode" readonly class="w-full border border-gray-200 bg-gray-100 p-2.5 rounded-md text-gray-500 cursor-not-allowed font-mono">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Yeni Ülke Adı</label>
                <input type="text" id="editName" required class="w-full border border-blue-300 p-2.5 rounded-md focus:ring-blue-500 focus:border-blue-500 text-lg">
                <p class="text-xs text-gray-500 mt-1">* Mevcut API yapısı gereği şu an sadece ülke adı güncellenebilmektedir.</p>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-md hover:bg-blue-700 transition font-bold shadow-lg">Değişiklikleri Kaydet</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
    const API_URL = "http://localhost:8181/countries";

    // Sayfa yüklendiğinde giriş kontrolü + URL'den kodu al (Örn: ?code=TR)
    window.onload = async () => {
        if (!isLoggedIn()) {
            alert("Ülke düzenlemek için giriş yapmanız gerekiyor.");
            window.location.href = '/login.html';
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (!code) {
            alert("Ülke kodu bulunamadı!");
            window.location.href = '/index.html';
            return;
        }

        document.getElementById('loadingIndicator').classList.remove('hidden');

        // Ülke bilgilerini getir (bu endpoint herkese açık, token gerekmiyor)
        try {
            const res = await fetch(`${API_URL}/getcountry/${code}`);
            const json = await res.json();

            if (json.success && json.data) {
                document.getElementById('editCode').value = json.data.code;
                document.getElementById('editName').value = json.data.name;

                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('editCountryForm').classList.remove('hidden');
            } else {
                alert("Ülke bilgileri alınamadı: " + json.message);
                window.location.href = '/index.html';
            }
        } catch (error) {
            console.error(error);
            alert("Bağlantı hatası!");
        }
    };

    // Formu gönder — bu endpoint admin yetkisi gerektiriyor, token şart
    document.getElementById('editCountryForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const code = document.getElementById('editCode').value;
        const newName = document.getElementById('editName').value;

        try {
            const res = await fetch(`${API_URL}/putcountry/${code}/${newName}`, {
                method: 'PUT',
                headers: authHeaders()
            });

            if (handleAuthError(res.status)) return;

            const result = await res.json();

            if (result.success) {
                alert(result.message || "Başarıyla güncellendi!");
                window.location.href = '/index.html';
            } else {
                alert("Hata: " + result.message);
            }
        } catch (error) {
            alert("Güncelleme işlemi sırasında sunucuya bağlanılamadı!");
        }
    });
</script>
</body>
</html>
